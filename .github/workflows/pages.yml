# Deploy the static site in /site to GitHub Pages.
# Pages is already set to build with GitHub Actions. This workflow does not
# set a custom domain and does not add a CNAME. mydeltaedu.com is out of scope.

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The committed site/ is built for the root of mydeltaedu.my. The Pages
      # preview lives under /mydelta-website/, so rebuild it with that base
      # path and mark it noindex (it is a preview, not the canonical site).
      - name: Assemble pages for the Pages project path
        run: python3 scripts/assemble_pages.py --base-path /mydelta-website/ --noindex

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
